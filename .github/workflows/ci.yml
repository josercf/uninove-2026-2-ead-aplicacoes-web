name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O portão real contra pacote vulnerável é o NuGet Audit, configurado em
      # topico-01-cliente-servidor/api/Directory.Build.props (NuGetAudit,
      # NuGetAuditMode=all e WarningsAsErrors para NU1901-NU1904). Com isso, o
      # próprio restore falha de forma determinística quando existe pacote
      # vulnerável, sem depender de nenhuma string de saída em inglês.
      - run: dotnet restore topico-01-cliente-servidor/ClinicaVida.sln
      - name: Conferir pacotes vulneráveis (verificação adicional, informativa)
        run: |
          saida=$(dotnet list topico-01-cliente-servidor/ClinicaVida.sln package --vulnerable --include-transitive)
          echo "$saida"
          if echo "$saida" | grep -q "has the following vulnerable packages"; then
            echo "Aviso: existe pacote com vulnerabilidade conhecida. O restore acima já deveria ter falhado por causa do NuGet Audit."
            exit 1
          fi
      - run: dotnet build topico-01-cliente-servidor/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-01-cliente-servidor/ClinicaVida.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-01-cliente-servidor/web
      - run: npm run build
        working-directory: topico-01-cliente-servidor/web

  html-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
        working-directory: topico-03-html-css

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-04-javascript
      - run: npm test
        working-directory: topico-04-javascript

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-05-react
      - run: npm test
        working-directory: topico-05-react
      - run: npm run build
        working-directory: topico-05-react

  rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O restore falha se houver pacote vulnerável (NuGet Audit em
      # topico-06-rest/api/Directory.Build.props, mesma regra do tópico 01).
      - run: dotnet restore topico-06-rest/ClinicaVida.sln
      - run: dotnet build topico-06-rest/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-06-rest/ClinicaVida.sln --no-build -c Release

  fetch-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O restore falha se houver pacote vulnerável (NuGet Audit em
      # topico-07-fetch/api/Directory.Build.props, mesma regra dos tópicos 01 e 06).
      - run: dotnet restore topico-07-fetch/ClinicaVida.sln
      - run: dotnet build topico-07-fetch/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-07-fetch/ClinicaVida.sln --no-build -c Release

  fetch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-07-fetch
      - run: npm test
        working-directory: topico-07-fetch
      - run: npm run build
        working-directory: topico-07-fetch

  persistencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O restore falha se houver pacote vulnerável (NuGet Audit em
      # topico-08-persistencia/api/Directory.Build.props, mesma regra dos tópicos anteriores).
      # Os testes usam SQLite em memória; nenhum servidor de banco é necessário.
      - run: dotnet restore topico-08-persistencia/ClinicaVida.sln
      - run: dotnet build topico-08-persistencia/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-08-persistencia/ClinicaVida.sln --no-build -c Release

  autenticacao-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O restore falha se houver pacote vulnerável (NuGet Audit em
      # topico-09-autenticacao/api/Directory.Build.props, mesma regra dos tópicos anteriores).
      # Os testes usam SQLite em memória e endereço https simulado; nenhum certificado é necessário.
      - run: dotnet restore topico-09-autenticacao/ClinicaVida.sln
      - run: dotnet build topico-09-autenticacao/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-09-autenticacao/ClinicaVida.sln --no-build -c Release

  autenticacao-xss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-09-autenticacao
      - run: npm test
        working-directory: topico-09-autenticacao

  testes-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O restore falha se houver pacote vulnerável (NuGet Audit em
      # topico-10-testes/api/Directory.Build.props, mesma regra dos tópicos anteriores).
      - run: dotnet restore topico-10-testes/ClinicaVida.sln
      - run: dotnet build topico-10-testes/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-10-testes/ClinicaVida.sln --no-build -c Release --collect:"XPlat Code Coverage"

  testes-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-10-testes
      - run: npm test
        working-directory: topico-10-testes
      - run: npm run cobertura
        working-directory: topico-10-testes
      - run: npm run build
        working-directory: topico-10-testes

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Constrói as duas imagens, sobe a API, o front e o volume do banco e roda o teste de fumaça com curl.
      - run: docker compose up -d --build
        working-directory: topico-11-containers
      - run: ./teste-de-fumaca.sh
        working-directory: topico-11-containers
      # Mostra os logs da API quando algo falha e remove containers e volume ao final.
      - if: failure()
        run: docker compose logs
        working-directory: topico-11-containers
      - if: always()
        run: docker compose down -v
        working-directory: topico-11-containers

  nuvem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # Testes de configuração: nenhum segredo nos arquivos versionados e /health respondendo 200.
      - run: dotnet restore topico-12-nuvem/ClinicaVida.sln
      - run: dotnet build topico-12-nuvem/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-12-nuvem/ClinicaVida.sln --no-build -c Release
      # Constrói a imagem, sobe a API com verificação de saúde e roda o teste de saúde no container.
      - run: docker compose up -d --build --wait
        working-directory: topico-12-nuvem
      - run: ./teste-de-saude.sh
        working-directory: topico-12-nuvem
      - if: failure()
        run: docker compose logs
        working-directory: topico-12-nuvem
      - if: always()
        run: docker compose down -v
        working-directory: topico-12-nuvem
