name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # O portão real contra pacote vulnerável é o NuGet Audit, configurado em
      # topico-01-cliente-servidor/api/Directory.Build.props (NuGetAudit,
      # NuGetAuditMode=all e WarningsAsErrors para NU1901-NU1904). Com isso, o
      # próprio restore falha de forma determinística quando existe pacote
      # vulnerável, sem depender de nenhuma string de saída em inglês.
      - run: dotnet restore topico-01-cliente-servidor/ClinicaVida.sln
      - name: Conferir pacotes vulneráveis (verificação adicional, informativa)
        run: |
          saida=$(dotnet list topico-01-cliente-servidor/ClinicaVida.sln package --vulnerable --include-transitive)
          echo "$saida"
          if echo "$saida" | grep -q "has the following vulnerable packages"; then
            echo "Aviso: existe pacote com vulnerabilidade conhecida. O restore acima já deveria ter falhado por causa do NuGet Audit."
            exit 1
          fi
      - run: dotnet build topico-01-cliente-servidor/ClinicaVida.sln --no-restore -c Release
      - run: dotnet test topico-01-cliente-servidor/ClinicaVida.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-01-cliente-servidor/web
      - run: npm run build
        working-directory: topico-01-cliente-servidor/web

  html-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
        working-directory: topico-03-html-css

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-04-javascript
      - run: npm test
        working-directory: topico-04-javascript

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: topico-05-react
      - run: npm test
        working-directory: topico-05-react
      - run: npm run build
        working-directory: topico-05-react
